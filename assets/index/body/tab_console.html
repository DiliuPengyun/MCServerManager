
      <section id="tab-console" class="panel">
        <div id="console-wrap">
          <div id="console-log"></div>
          <button id="back-to-bottom" style="display:none">回到底部 ↓</button>
        </div>
        <form id="cmd-form">
          <input id="cmd-input" autocomplete="off" spellcheck="false" placeholder="输入服务器指令，回车发送">

        </form>
      </section>
